name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 tools/check_public.py
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python tests/test_extract.py
      - name: Check style and Python sources
        run: |
          pip install ruff==0.17.5
          ruff check --config tools/ruff.toml .
          python tools/make_style.py --check
      - name: Check translation catalogues
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext
          python tools/compile_po.py --check
      - name: The whole suite (the common tests of the model's copies too)
        run: python tools/run_tests.py tests
      - name: The verification of signatures, with the pyHanko the builds carry
        # tools/flatpak_wheels.py is the one place where its version is written
        run: |
          pip install "pyhanko[etsi]==$(python tools/flatpak_wheels.py --version)"
          python tests/test_verify.py -v 2>&1 | tee verify.log
          if grep -q "skipped" verify.log; then echo "the checks were skipped: pyHanko did not load"; exit 1; fi
          python tools/flatpak_wheels.py --check
      - name: Validate desktop entry and AppStream metadata
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils appstream
          desktop-file-validate data/io.github.daniel_g_carrasco.p7m-extractor.desktop
          appstreamcli validate --no-net data/io.github.daniel_g_carrasco.p7m-extractor.metainfo.xml
      - name: Check that the tag matches __version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="$(python -c 'import sys; sys.path.insert(0, "src"); import p7m_extractor as p; print(p.__version__)')"
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match __version__ = $v"; exit 1
          fi

  windows:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: zip curl
      - name: Install the verified UCRT64 build inputs
        run: |
          set -euo pipefail
          archives=$(mktemp -d)
          while read -r checksum file; do
            [[ -z "$checksum" || "$checksum" == \#* ]] && continue
            url="https://repo.msys2.org/mingw/ucrt64/$file"
            curl -fsSL --retry 3 "$url" -o "$archives/$file"
            curl -fsSL --retry 3 "$url.sig" -o "$archives/$file.sig"
            (cd "$archives" && printf '%s  %s\n' "$checksum" "$file" | sha256sum --check --strict -)
          done < build-aux/windows/msys2-packages.lock
          sed -E '/^[[:space:]]*LocalFileSigLevel[[:space:]]*=/d; /^\[options\]$/a LocalFileSigLevel = Required' \
            /etc/pacman.conf > "$archives/pacman.conf"
          pacman --config "$archives/pacman.conf" -U --noconfirm --needed "$archives"/*.pkg.tar.zst
      - name: pyHanko, for the verification of signatures
        # Compiled extensions come from the locked MSYS2 packages above.
        run: |
          python -m pip install --break-system-packages --no-deps --require-hashes -r build-aux/windows/python-wheels.lock
          python -c "from importlib.metadata import version; assert version('pyhanko') == '$(python tools/flatpak_wheels.py --version)'"
          python tests/test_verify.py -v 2>&1 | tee verify.log
          if grep -q "skipped" verify.log; then echo "the checks were skipped: pyHanko did not load"; exit 1; fi
      - name: Record the checked-out source commit
        shell: pwsh
        run: |
          $revision = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "APP_SOURCE_REVISION=$revision" >> $env:GITHUB_ENV
      - name: Build with PyInstaller
        run: |
          python tools/compile_po.py
          pyinstaller --noconfirm p7m-extractor.spec
      - name: Verify GTK 4, gdbus, CA bundle, icons and translations are in the bundle
        run: |
          I=dist/p7m-extractor/_internal
          test -f "$I/gi_typelibs/Gtk-4.0.typelib"
          test -f "$I/gi_typelibs/Adw-1.typelib"
          test -f "$I/lib/gdk-pixbuf/loaders.cache"
          test -f "$I/lib/gdk-pixbuf/loaders/pixbufloader_svg.dll"
          test -f "$I/lib/gdk-pixbuf/loaders/libpixbufloader-png.dll"
          ls "$I"/libadwaita-1-*.dll
          ls "$I"/libgtk-4-*.dll
          test -f "$I/gdbus.exe"          # single-instance support (GApplication)
          test -f "$I/certs/ca-bundle.crt" # TLS for the update check and the trusted lists
          test -f "$I/pyhanko/sign/validation/qualified/lotl-certs/latest.cert.pem"  # who signs the European list of lists
          test -f "$I/share/icons/hicolor/scalable/apps/io.github.daniel_g_carrasco.p7m-extractor.svg"
          test -f "$I/share/locale/it/LC_MESSAGES/p7m-extractor.mo"
          test -f "$I/licenses/LICENSE"                   # the GPL travels with the program
          test -f "$I/licenses/msys2/PACKAGES.txt"        # the MSYS2 packages, their licences and sources
          test -f "$I/licenses/inventory.json"
          test -f "$I/p7m_extractor/gui/style.css"
          find "$I/licenses/msys2" -path '*/gtk4/COPYING' -print -quit | grep -q .
      - name: Ensure GLib schemas and icon themes are bundled
        run: |
          APPDIR=dist/p7m-extractor/_internal
          if [ ! -f "$APPDIR/share/glib-2.0/schemas/gschemas.compiled" ]; then
            mkdir -p "$APPDIR/share/glib-2.0/schemas"
            cp /ucrt64/share/glib-2.0/schemas/gschemas.compiled "$APPDIR/share/glib-2.0/schemas/"
          fi
          mkdir -p "$APPDIR/share/icons"
          # -n: merge without overwriting the app icons already placed by the spec
          cp -rn /ucrt64/share/icons/Adwaita "$APPDIR/share/icons/" || true
          test -f "$APPDIR/share/icons/hicolor/index.theme"
      - name: Slim the bundle (locales and icon variants the app never loads)
        run: |
          I=dist/p7m-extractor/_internal
          [ -d "$I/share/locale" ] && find "$I/share/locale" -mindepth 1 -maxdepth 1 ! -name it ! -name 'en*' -exec rm -rf {} + || true
          rm -rf "$I/share/icons/AdwaitaLegacy" "$I/share/icons/Adwaita/cursors"
          # fresh icon caches for the slimmed themes: without them GTK scans
          # thousands of icon files at start-up
          gtk4-update-icon-cache -q -t -f "$I/share/icons/Adwaita"
          gtk4-update-icon-cache -q -t -f "$I/share/icons/hicolor"
          du -sm "$I" | cut -f1 | xargs -I{} echo "bundle after slimming: {} MB"
      - name: Seal the staged Windows inventory
        run: python tools/package_inventory.py --bundle dist/p7m-extractor --seal p7m-extractor.exe --strict --msys-root "$(cygpath -w /)"
      - name: Smoke test (CLI through the bundled exe)
        run: |
          python tests/test_extract.py --make-sample sample.p7m
          ./dist/p7m-extractor/p7m-extractor.exe sample.p7m
          test -f sample
      - name: Smoke test (update check reaches GitHub over TLS)
        run: ./dist/p7m-extractor/p7m-extractor.exe --check-update
      - name: Smoke test (signatures checked by the bundled exe)
        # the sample's certifier is the tests' own, in no trusted list: the
        # outcome is never a pass (0), and never a crash; 3 = not established
        run: |
          python tests/test_verify.py --make-sample signed.pdf.p7m.p7m
          for mode in --offline --online; do
            option="$mode"; [ "$mode" = --online ] && option=""
            code=0
            ./dist/p7m-extractor/p7m-extractor.exe --verify $option signed.pdf.p7m.p7m > "verify$mode.txt" 2>&1 || code=$?
            cat "verify$mode.txt"
            test "$code" = 3
            grep -q "Anna Bianchi" "verify$mode.txt"
            grep -q "Bruno Verdi" "verify$mode.txt"
          done
          if ls "$LOCALAPPDATA/p7m-extractor/trusted-lists"/* >/dev/null 2>&1; then
            echo "the European trusted lists were fetched and kept"
          else
            echo "::warning::the European trusted lists were not fetched in this run: look at the output above"
          fi
      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          case "$VERSION" in v*) ;; *) VERSION=dev ;; esac
          (cd dist && zip -qr "../p7m-extractor-${VERSION}-windows-x64-portable.zip" p7m-extractor)
          python tools/package_inventory.py --portable "p7m-extractor-${VERSION}-windows-x64-portable.zip"
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          # Inno's AppVersion wants a bare number; the "v" is re-added to the
          # output filename by the .iss so assets stay named v1.1.0.
          $version = if ($env:GITHUB_REF_NAME -like 'v*') { $env:GITHUB_REF_NAME.Substring(1) } else { 'dev' }
          & $iscc "/DAppVersion=$version" "installer\p7m-extractor.iss"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Update as the app does (silent, the app opens again)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem installer\Output -Filter 'p7m-extractor-setup-*.exe' | Select-Object -First 1).FullName
          $installed = Join-Path $env:RUNNER_TEMP 'p7m-install'
          $exe = Join-Path $installed 'p7m-extractor.exe'
          $logDir = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'p7m-setup-logs')
          $opts = '/VERYSILENT', '/CURRENTUSER', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$installed`"", '/LOGCLOSEAPPLICATIONS'
          function Find-App {
            Get-Process p7m-extractor -ErrorAction SilentlyContinue | Where-Object Path -eq $exe
          }
          function Wait-ForWindow {
            $deadline = [DateTime]::UtcNow.AddSeconds(30)
            do {
              $apps = @(Find-App)
              if ($apps.Count -gt 1) { throw "Expected one app, found $($apps.Count)" }
              if ($apps.Count -eq 1 -and $apps[0].MainWindowHandle -ne 0) { return $apps[0] }
              Start-Sleep -Milliseconds 200
            } while ([DateTime]::UtcNow -lt $deadline)
            throw 'The app window did not open'
          }
          function Start-Setup($name, $switches) {
            $script:log = Join-Path $logDir "$name.log"
            Start-Process $setup -ArgumentList ($opts + $switches + "/LOG=`"$log`"") -PassThru
          }
          function Confirm-Setup($process, $name) {
            # -Wait on Start-Process would wait for the app that Setup reopens.
            if (-not $process.WaitForExit(300000)) { throw "$name timed out" }
            if ($process.ExitCode -ne 0) { throw "$name failed with exit code $($process.ExitCode)" }
          }
          function Wait-ForSetupLog($process, $pattern, $seconds) {
            $deadline = [DateTime]::UtcNow.AddSeconds($seconds)
            while (!(Select-String -LiteralPath $log -Pattern $pattern -Quiet -ErrorAction SilentlyContinue)) {
              if ($process.HasExited -or [DateTime]::UtcNow -ge $deadline) { throw "$log missed: $pattern" }
              Start-Sleep -Milliseconds 100
            }
          }
          try {
            Confirm-Setup (Start-Setup 'install' @()) 'install'
            Start-Sleep -Seconds 2
            if (Find-App) { throw 'Silent install opened the app without an update flag' }
            Add-Content (Join-Path $env:LOCALAPPDATA 'p7m-extractor/settings.ini') 'ask_default_app=false'
            Start-Process $exe
            $app = Wait-ForWindow
            foreach ($name in 'legacy', 'pid', 'both-flags') {
              $switches = switch ($name) {
                'legacy' { '/RELAUNCH=1' }
                'pid' { '/RESTARTAPP=1'; "/UPDATEPID=$($app.Id)" }
                'both-flags' { '/RESTARTAPP=1'; '/RELAUNCH=1' }
              }
              $broker = $null
              try {
                # Keep a lock past the app's exit even if it shares another session broker.
                if ($name -eq 'pid') {
                  $broker = [IO.File]::Open((Join-Path $installed '_internal/gdbus.exe'), 'Open', 'Read', 'ReadWrite')
                }
                $p = Start-Setup $name @($switches)
                Wait-ForSetupLog $p 'Waiting for update files' 30
                Write-Host "$name waiting for app PID $($app.Id) and its bundled files"
                if ($app.HasExited -or $p.HasExited) { throw "$name did not wait for the running app" }
                if (!$app.CloseMainWindow() -or !$app.WaitForExit(10000)) { throw 'The app did not close' }
                if ($broker) {
                  Wait-ForSetupLog $p "Update PID $($app.Id) exited: 1" 10
                  Wait-ForSetupLog $p 'Update file busy: .*gdbus\.exe' 10
                }
              } finally {
                if ($broker) { $broker.Dispose() }
              }
              Confirm-Setup $p $name
              $reopened = Wait-ForWindow
              if ($reopened.Id -eq $app.Id) { throw "$name kept the original app" }
              $app = $reopened
            }
            $payload = Get-Content "dist/p7m-extractor/_internal/licenses/inventory.json" -Raw | ConvertFrom-Json -AsHashtable
            foreach ($file in $payload.payload.GetEnumerator()) {
              $actual = (Get-FileHash -LiteralPath (Join-Path $installed $file.Key)).Hash.ToLowerInvariant()
              if ($actual -ne $file.Value) { throw "Installer payload differs: $($file.Key)" }
            }
          } finally {
            Find-App | Stop-Process
            Get-ChildItem $logDir -Filter '*.log' | ForEach-Object {
              Write-Host "Setup log: $($_.Name)"
              Select-String -LiteralPath $_.FullName -Pattern 'update files|Update PID|Update file busy|Restart Manager|Error|Exit code'
            }
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-setup-logs
          path: ${{ runner.temp }}/p7m-setup-logs/
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: p7m-extractor-*-windows-x64-portable.zip
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: installer/Output/p7m-extractor-setup-*.exe

  linux:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install GTK 4, libadwaita and PyGObject
        run: |
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-4.0 \
            gir1.2-adw-1 libadwaita-1-0 libgtk-4-1 libgtk-4-bin python3-venv \
            libpython3.12 libglib2.0-bin binutils
      - name: Build with PyInstaller
        env:
          P7M_LINUX_SOURCE_INPUTS: "1"
        run: |
          python3 tools/compile_po.py
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --only-binary=:all: --report "$RUNNER_TEMP/python-install.json" \
            pyinstaller "pyhanko[etsi]==$(python3 tools/flatpak_wheels.py --version)" \
            'cffi==2.1.1' 'cryptography==50.0.2' 'lxml==6.1.3'
          .venv/bin/pyinstaller --noconfirm p7m-extractor.spec
      - name: Verify GTK 4, libadwaita and the translations are in the bundle
        run: |
          test -f dist/p7m-extractor/_internal/gi_typelibs/Gtk-4.0.typelib
          test -f dist/p7m-extractor/_internal/gi_typelibs/Adw-1.typelib
          ls dist/p7m-extractor/_internal/libgtk-4*.so*
          ls dist/p7m-extractor/_internal/libadwaita-1*.so*
          test -f dist/p7m-extractor/_internal/share/locale/it/LC_MESSAGES/p7m-extractor.mo
          test -f dist/p7m-extractor/_internal/pyhanko/sign/validation/qualified/lotl-certs/latest.cert.pem
          test -f dist/p7m-extractor/_internal/certifi/cacert.pem
          test -f dist/p7m-extractor/_internal/licenses/LICENSE
      - name: Slim the bundle (locales and icon variants the app never loads)
        run: |
          I=dist/p7m-extractor/_internal
          [ -d "$I/share/locale" ] && find "$I/share/locale" -mindepth 1 -maxdepth 1 ! -name it ! -name 'en*' -exec rm -rf {} + || true
          rm -rf "$I/share/icons/AdwaitaLegacy" "$I/share/icons/Adwaita/cursors"
          [ -d "$I/share/icons/Adwaita" ] && gtk4-update-icon-cache -q -t -f "$I/share/icons/Adwaita" || true
          du -sm "$I" | cut -f1 | xargs -I{} echo "bundle after slimming: {} MB"
      - name: Smoke test (CLI through the bundled binary)
        run: |
          python3 tests/test_extract.py --make-sample sample.p7m
          ./dist/p7m-extractor/p7m-extractor sample.p7m
          test -f sample
      - name: Smoke test (signatures checked by the bundled binary)
        # the sample's certifier is the tests' own, in no trusted list: the
        # outcome is never a pass (0), and never a crash; 3 = not established
        run: |
          .venv/bin/python tests/test_verify.py --make-sample signed.pdf.p7m.p7m
          for mode in --offline --online; do
            option="$mode"; [ "$mode" = --online ] && option=""
            code=0
            ./dist/p7m-extractor/p7m-extractor --verify $option signed.pdf.p7m.p7m > "verify$mode.txt" 2>&1 || code=$?
            cat "verify$mode.txt"
            test "$code" = 3
            grep -q "Anna Bianchi" "verify$mode.txt"
            grep -q "Bruno Verdi" "verify$mode.txt"
          done
          if ls "${XDG_CONFIG_HOME:-$HOME/.config}/p7m-extractor/trusted-lists"/* >/dev/null 2>&1; then
            echo "the European trusted lists were fetched and kept"
          else
            echo "::warning::the European trusted lists were not fetched in this run: look at the output above"
          fi
      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          case "$VERSION" in v*) ;; *) VERSION=dev ;; esac
          tar -C dist -czf "p7m-extractor-${VERSION}-linux-x64-portable.tar.gz" p7m-extractor
      - name: Collect the portable build's corresponding sources
        run: |
          python3 tools/linux_source_inputs.py --bundle dist/p7m-extractor \
            --binary p7m-extractor-*-linux-x64-portable.tar.gz --inputs build/p7m-extractor/linux-inputs.json \
            --pip-report "$RUNNER_TEMP/python-install.json" --cache "$RUNNER_TEMP/portable-sources" \
            --output linux-portable-sources.zip
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: p7m-extractor-*-linux-x64-portable.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: linux-portable-sources
          path: linux-portable-sources.zip

  flatpak:
    needs: test
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - name: Build and export
        run: |
          set -eu
          manifest=build-aux/flatpak/io.github.daniel_g_carrasco.p7m-extractor.yaml
          version=dev
          case "$GITHUB_REF" in refs/tags/v*) version="$GITHUB_REF_NAME" ;; esac
          flatpak-builder --show-manifest "$manifest" > "$RUNNER_TEMP/flatpak-manifest.json"
          flatpak-builder --disable-rofiles-fuse --force-clean --arch=x86_64 --repo=repo build-dir "$manifest"
          flatpak build-bundle repo "p7m-extractor-${version}-linux-x64.flatpak" \
            io.github.daniel_g_carrasco.p7m-extractor stable \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Collect the Flatpak's corresponding sources
        run: |
          git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" \
            python3 tools/linux_source_inputs.py --bundle build-dir/files \
              --binary p7m-extractor-*-linux-x64.flatpak --manifest "$RUNNER_TEMP/flatpak-manifest.json" \
              --sdk "$(flatpak info --show-commit org.gnome.Sdk//50)" \
              --runtime "$(flatpak info --show-commit org.gnome.Platform//50)" \
              --cache "$RUNNER_TEMP/flatpak-sources" --output flatpak-sources.zip
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: p7m-extractor-*-linux-x64.flatpak
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak-sources
          path: flatpak-sources.zip
      - name: Lint the manifest for Flathub (informational)
        run: |
          if command -v flatpak-builder-lint >/dev/null 2>&1; then
            flatpak-builder-lint --exceptions manifest build-aux/flatpak/io.github.daniel_g_carrasco.p7m-extractor.yaml || true
          else
            echo "flatpak-builder-lint not available in this image"
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          pattern: "{windows-x64,windows-installer,linux-x64,flatpak}"
      - name: Sign with the project's key (minisign), checked before anything is uploaded
        # the installed app runs an update only with this signature (the same
        # public key is in the code); the comment names the file, so another
        # release's installer is not taken for this one
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          PUBLIC_KEY: RWRF+AifJvn/zhz0o7MBObIYHgw9+sWoc4GaBK+qYnJY0AqeJm540y0a
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          key="$RUNNER_TEMP/minisign.key"
          (umask 077
           case "$MINISIGN_SECRET_KEY" in
             "untrusted comment:"*) printf '%s\n' "$MINISIGN_SECRET_KEY" ;;
             *) printf 'untrusted comment: releases\n%s\n' "$MINISIGN_SECRET_KEY" ;;
           esac | tr -d '\r' > "$key")
          ls *-setup-v*-windows-x64.exe
          for f in *.zip *.tar.gz *.exe *.flatpak; do
            [ -f "$f" ] || continue
            minisign -S -s "$key" -m "$f" -x "$f.minisig" -t "timestamp:$(date +%s) file:$f hashed" </dev/null
            minisign -V -P "$PUBLIC_KEY" -m "$f" -x "$f.minisig"
          done
          rm -f "$key"
      - name: Prepare the notes in both languages
        run: python3 tools/release_notes.py "$GITHUB_REF_NAME" --italian-output release-notes.it.md > release-body.md
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          body_path: release-body.md
          files: |
            *.zip
            *.tar.gz
            *.exe
            *.flatpak
            *.minisig
            release-notes.it.md
