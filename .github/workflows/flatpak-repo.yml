name: Flatpak repository

# Publishes the app to our own Flatpak repository (an ostree repo on the
# gh-pages branch, served by GitHub Pages): a complete published release
# lands there as the "stable" branch, signed with the key in the FLATPAK_GPG_PRIVATE_KEY secret.
# Users install once from p7m-extractor.flatpakref and get updates from
# GNOME Software like any other app. The GNOME runtime comes from Flathub.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable release tag to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: flatpak-repo
  cancel-in-progress: false

env:
  BASE_URL: https://daniel-g-carrasco.github.io/p7m-extractor

jobs:
  publish:
    if: github.event_name == 'release' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
    steps:
      - name: Require the latest stable release with sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          test "$RELEASE_TAG" = "$latest"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets \
            --jq 'if .isDraft or .isPrerelease then empty else .assets[].name end' \
            | grep -Fx "p7m-extractor-${RELEASE_TAG}-sources.zip"

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Fetch the published repository
        run: |
          git config --global --add safe.directory '*'
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git clone --depth 1 --branch gh-pages "$url" pages 2>/dev/null; then
            # git does not store empty directories, and ostree refuses to
            # list refs without the ones it created: put them back
            mkdir -p pages/repo/refs/remotes pages/repo/refs/mirrors \
              pages/repo/extensions pages/repo/state pages/repo/tmp/cache
            echo "existing repository fetched"
          else
            git init -b gh-pages pages
            git -C pages remote add origin "$url"
            echo "first publication: new gh-pages branch"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Import the signing key
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 -p "$GNUPGHOME"
          printf '%s\n' "$FLATPAK_GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          gpg --batch --list-secret-keys --with-colons | grep "^fpr:.*:${FLATPAK_GPG_KEY_ID}:" >/dev/null \
            || { echo "secret key ${FLATPAK_GPG_KEY_ID} not found after import"; exit 1; }
          gpg --batch --export "$FLATPAK_GPG_KEY_ID" > "$GNUPGHOME/pubring.gpg"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          FLATPAK_GPG_KEY_ID: ${{ vars.FLATPAK_GPG_KEY_ID }}

      - name: Import the exact Flatpak from the release
        run: |
          bundle="p7m-extractor-${RELEASE_TAG}-linux-x64.flatpak"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$bundle" --pattern "$bundle.minisig"
          PYTHONPATH=src python3 - "$bundle" <<'PY'
          import sys
          from pathlib import Path

          from p7m_extractor import PUBLIC_KEY
          from p7m_extractor.app import minisign

          bundle = Path(sys.argv[1])
          digest = minisign.blake2b()
          with bundle.open("rb") as stream:
              for block in iter(lambda: stream.read(1024 * 1024), b""):
                  digest.update(block)
          signature = bundle.with_suffix(".flatpak.minisig").read_text(encoding="utf-8")
          print("Signature verified:", minisign.verify(digest.digest(), signature, PUBLIC_KEY))
          PY
          flatpak build-import-bundle --no-update-summary \
            --gpg-sign="$FLATPAK_GPG_KEY_ID" --gpg-homedir="$GNUPGHOME" pages/repo "$bundle"
          flatpak build-update-repo --generate-static-deltas --prune --prune-depth=3 \
            --gpg-sign="$FLATPAK_GPG_KEY_ID" --gpg-homedir="$GNUPGHOME" pages/repo
          ostree refs --repo=pages/repo
        env:
          FLATPAK_GPG_KEY_ID: ${{ vars.FLATPAK_GPG_KEY_ID }}
          GH_TOKEN: ${{ github.token }}

      - name: Write the .flatpakref, .flatpakrepo and index page
        run: |
          key="$(gpg --batch --export "$FLATPAK_GPG_KEY_ID" | base64 -w0)"
          version="$(python3 -c 'import sys; sys.path.insert(0, "src"); import p7m_extractor as p; print(p.__version__)')"
          python3 tools/flatpak_repo_files.py pages "$BASE_URL" "$key" "$version" \
            --sources-asset "p7m-extractor-${RELEASE_TAG}-sources.zip"
          cp data/icons/hicolor/256x256/apps/io.github.daniel_g_carrasco.p7m-extractor.png pages/icon.png
          echo "version=$version" >> "$GITHUB_ENV"
        env:
          FLATPAK_GPG_KEY_ID: ${{ vars.FLATPAK_GPG_KEY_ID }}

      - name: Publish
        run: |
          app_commit="$(git rev-parse --short=7 HEAD)"
          cd pages
          git add -A
          if git diff --cached --quiet; then echo "nothing new to publish"; exit 0; fi
          git commit -q -m "Publish ${version} (${app_commit})"
          git push origin gh-pages
          echo "published ${version} to ${BASE_URL}"
