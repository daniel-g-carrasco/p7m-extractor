<?xml version="1.0" encoding="UTF-8"?>
<!-- P7M Extractor symbolic icon. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Monochrome, on the 16 px grid: a document with a folded corner and a
       seal with a check mark, one pixel of clearance between the two. Fills
       only, because GTK recolours symbolic icons through the fill property.
       Keep the header short: gdk-pixbuf only looks for <svg> in the first
       256 bytes, and flatpak-builder rejects icons it cannot load. -->
