# Flatpak manifest, used for local builds and by CI.
#
#   flatpak install flathub org.gnome.Platform//50 org.gnome.Sdk//50
#   flatpak-builder --user --install --force-clean build-dir \
#       build-aux/flatpak/io.github.daniel_g_carrasco.p7m-extractor.yaml
#   flatpak run io.github.daniel_g_carrasco.p7m-extractor
#
# The Flathub submission uses this same file with the `dir` source replaced
# by the tagged git release (type: git, url, tag, commit).
app-id: io.github.daniel_g_carrasco.p7m-extractor
branch: stable
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: p7m-extractor

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # The extracted document is written next to the signed file the user drops,
  # picks or opens, and folders are scanned recursively. That needs real write
  # access to those locations (home, removable media, network mounts), which
  # the document portal (single file, read-only parent) cannot grant.
  - --filesystem=host
  # Verifying a signature asks the European trusted lists and the certifier's
  # revocation server. No document is sent: only the lists are fetched and
  # the certificate's serial number is asked about. Without the network the
  # app says so and checks the integrity alone.
  - --share=network

modules:
  # The verification of the signatures: pyHanko and what it needs, as the
  # wheels pinned in tools/flatpak_wheels.py, which writes the block between
  # the two marks (and with --check says if it is still what it would write).
  # Nothing is fetched while building beyond these files.
  - name: python3-pyhanko
    buildsystem: simple
    build-commands:
      # --ignore-installed: the Sdk has some of these (lxml) and pip would
      # leave them out, but the Platform the app runs on does not
      - pip3 install --prefix=${FLATPAK_DEST} --no-deps --no-index --no-build-isolation --ignore-installed *.whl
