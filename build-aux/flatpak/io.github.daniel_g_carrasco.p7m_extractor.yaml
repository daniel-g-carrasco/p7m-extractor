# Flatpak manifest, used for local builds and by CI.
#
#   flatpak install flathub org.gnome.Platform//50 org.gnome.Sdk//50
#   flatpak-builder --user --install --force-clean build-dir \
#       build-aux/flatpak/io.github.daniel_g_carrasco.p7m_extractor.yaml
#   flatpak run io.github.daniel_g_carrasco.p7m_extractor
#
# The Flathub submission uses this same file with the `dir` source replaced
# by the tagged git release (type: git, url, tag, commit).
app-id: io.github.daniel_g_carrasco.p7m_extractor
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: p7m-extractor

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # The extracted document is written next to the signed file the user drops,
  # picks or opens, and folders are scanned recursively. That needs real write
  # access to those locations (home, removable media, network mounts), which
  # the document portal (single file, read-only parent) cannot grant.
  - --filesystem=host

modules:
  - name: p7m-extractor
    buildsystem: simple
    build-commands:
      # pure Python, PyGObject and GTK 4 come with the GNOME runtime
      - install -Dm755 p7m_extractor.py /app/bin/p7m-extractor
      - python3 tools/compile_po.py --dest /app/share/locale
      - install -Dm644 data/io.github.daniel_g_carrasco.p7m_extractor.desktop -t /app/share/applications
      - install -Dm644 data/io.github.daniel_g_carrasco.p7m_extractor.metainfo.xml -t /app/share/metainfo
      - install -Dm644 data/icons/hicolor/scalable/apps/io.github.daniel_g_carrasco.p7m_extractor.svg -t /app/share/icons/hicolor/scalable/apps
      - install -Dm644 data/icons/hicolor/symbolic/apps/io.github.daniel_g_carrasco.p7m_extractor-symbolic.svg -t /app/share/icons/hicolor/symbolic/apps
      - install -Dm644 data/icons/hicolor/64x64/apps/io.github.daniel_g_carrasco.p7m_extractor.png -t /app/share/icons/hicolor/64x64/apps
      - install -Dm644 data/icons/hicolor/128x128/apps/io.github.daniel_g_carrasco.p7m_extractor.png -t /app/share/icons/hicolor/128x128/apps
      - install -Dm644 data/icons/hicolor/256x256/apps/io.github.daniel_g_carrasco.p7m_extractor.png -t /app/share/icons/hicolor/256x256/apps
      # fail the build early on invalid desktop entry / metainfo
      - desktop-file-validate /app/share/applications/io.github.daniel_g_carrasco.p7m_extractor.desktop
      - appstreamcli validate --no-net /app/share/metainfo/io.github.daniel_g_carrasco.p7m_extractor.metainfo.xml
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - dist
          - build
